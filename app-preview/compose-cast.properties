# compose-cast Preview (T-045, ADR 0024): one generic app that shows any compose-cast server, chosen
# at runtime from the admin panel's QR code (the server's /connect page) or typed in. Not a template
# for branded apps: app.preview=true allows plain HTTP to any host in every build.
app.name=compose-cast Preview
app.applicationId=io.composecast.preview
app.preview=true

app.versionCode=1
app.versionName=0.1.0

app.frame.primaryColor=#1D1D1F
app.frame.backgroundColor=#FFFFFF
