[versions]
kotlin = "2.2.20"
agp = "9.5.1"
remote-compose = "1.0.0-alpha20"
ktor = "3.0.0"
kotlinx-serialization = "1.7.3"

[libraries]
remote-core = { module = "androidx.compose.remote:remote-core", version.ref = "remote-compose" }
remote-creation-jvm = { module = "androidx.compose.remote:remote-creation-jvm", version.ref = "remote-compose" }
remote-creation-core = { module = "androidx.compose.remote:remote-creation-core", version.ref = "remote-compose" }
remote-player-core = { module = "androidx.compose.remote:remote-player-core", version.ref = "remote-compose" }
remote-player-view = { module = "androidx.compose.remote:remote-player-view", version.ref = "remote-compose" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version = "1.7.5" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version = "1.7.5" }
compose-material3 = { module = "androidx.compose.material3:material3", version = "1.3.1" }
compose-ui = { module = "androidx.compose.ui:ui", version = "1.7.5" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version = "1.7.5" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version = "1.7.5" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
