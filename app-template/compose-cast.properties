# compose-cast app configuration (T-011): everything that differs between apps built from
# app-template. Use another file with `./gradlew -Pcomposecast.appConfig=<path> ...`.
# Missing or invalid keys fail the build with the key's name.

# Launcher label and package (apps with different ids install side by side).
app.name=ComposeCast Demo
app.applicationId=io.composecast.demo

# Optional: version shown in the store / settings; versionCode must grow with every release.
app.versionCode=1
app.versionName=0.1.0

# compose-cast server. 10.0.2.2 = the host's localhost from the Android emulator.
# Release builds require https://.
app.serverUrl=http://10.0.2.2:8080

# Native frame shown around the server documents (top app bar, status bar, splash).
# Screen content colors come from the server's brand (GET /brand), not from here.
app.frame.primaryColor=#6200EE
app.frame.backgroundColor=#FAFAFA

# Optional launcher icon (PNG/JPG, path relative to this file; square, >= 432 px recommended).
# Empty = default icon. Its background defaults to app.frame.primaryColor.
app.icon=
app.icon.backgroundColor=
