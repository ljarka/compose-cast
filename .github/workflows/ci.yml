name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      # The same single entry point agents run locally: docs, architecture rules, JVM build + tests,
      # Android build + lint (ubuntu-latest ships the Android SDK), screenshot verification.
      - name: Verify
        run: ./scripts/verify.sh
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: compat-tests/build/outputs/roborazzi/

  # Server image smoke test (T-009): build server-app/Dockerfile, run it on examples/demo,
  # healthcheck + /screens. Same command locally: ./scripts/verify.sh --docker
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker image
        run: ./scripts/verify.sh --docker
