name: Release

# Server image on GHCR (T-023, ADR 0018):
# - push to main      → ghcr.io/ljarka/compose-cast-server:main
# - release published → :<tag> (e.g. v0.1.0) and :release, plus distribution/docker-compose.yml and
#                       distribution/example.env as release assets (the install downloads them from
#                       releases/latest, so do not mark a release as pre-release).
# - release published → Android artifacts (protocol, sdk-android, app-shell, io.composecast.app plugin)
#                       in version <tag without v> to the Reposilite repository (T-024, ADR 0019);
#                       skipped until the variable COMPOSECAST_MAVEN_URL is set
#                       (docs/playbooks/maven-repository.md).
# - release published → compose-cast-preview.apk (the generic Preview app, T-045, ADR 0024) as a
#                       release asset, signed with the secrets COMPOSECAST_PREVIEW_KEYSTORE_BASE64,
#                       COMPOSECAST_PREVIEW_STORE_PASSWORD, COMPOSECAST_PREVIEW_KEY_PASSWORD (alias
#                       "preview"); skipped with a warning while they are missing
#                       (docs/playbooks/preview-app.md).
# - push to main / release → ghcr.io/ljarka/compose-cast-preview-renderer, same tags as the server
#                       (T-048): the optional phone preview renderer, linux/amd64 only (Robolectric's
#                       native graphics have no linux/arm64 build).

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ljarka/compose-cast-server

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The runtime stage runs commands (adduser) for arm64 too: needs QEMU. The Gradle stage runs
      # once on the build platform (server-app/Dockerfile).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags and OCI labels (org.opencontainers.image.source links the package to this repository).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=release,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=compose-cast-server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server-app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  renderer-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      # Needs the Android SDK (ubuntu-latest ships it), so it is built here, not inside Docker.
      - name: Build the renderer directory
        run: ./gradlew --console=plain :preview-renderer:installRenderer
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ljarka/compose-cast-preview-renderer
          tags: |
            type=raw,value=main,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=release,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=compose-cast-preview-renderer
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: preview-renderer/build/renderer
          file: preview-renderer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  assets:
    if: github.event_name == 'release'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload install files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            distribution/docker-compose.yml distribution/example.env --clobber

  maven:
    if: github.event_name == 'release' && vars.COMPOSECAST_MAVEN_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish to Reposilite
        env:
          TAG: ${{ github.event.release.tag_name }}
          ORG_GRADLE_PROJECT_composecastMavenUrl: ${{ vars.COMPOSECAST_MAVEN_URL }}
          ORG_GRADLE_PROJECT_composecastUsername: ${{ secrets.COMPOSECAST_MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_composecastPassword: ${{ secrets.COMPOSECAST_MAVEN_PASSWORD }}
        run: ./gradlew --console=plain -PcomposecastVersion="${TAG#v}" publish :gradle-plugins:publish

  preview-apk:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.COMPOSECAST_PREVIEW_KEYSTORE_BASE64 }}
      COMPOSECAST_SIGNING_STORE_PASSWORD: ${{ secrets.COMPOSECAST_PREVIEW_STORE_PASSWORD }}
      COMPOSECAST_SIGNING_KEY_PASSWORD: ${{ secrets.COMPOSECAST_PREVIEW_KEY_PASSWORD }}
    steps:
      - name: Signing secrets present?
        id: secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::COMPOSECAST_PREVIEW_KEYSTORE_BASE64 is not set: no compose-cast-preview.apk for this release (docs/playbooks/preview-app.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.secrets.outputs.ok == 'true'
      - name: Build the signed Preview APK
        if: steps.secrets.outputs.ok == 'true'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The keystore stays outside the repository; a copy of the properties adds the signing keys.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/preview.jks"
          config="$RUNNER_TEMP/compose-cast.properties"
          grep -v '^app.version' app-preview/compose-cast.properties > "$config"
          {
            echo "app.versionName=${TAG#v}"
            echo "app.versionCode=${{ github.run_number }}"
            echo "app.signing.storeFile=$RUNNER_TEMP/preview.jks"
            echo "app.signing.keyAlias=preview"
          } >> "$config"
          ./gradlew --console=plain -Pcomposecast.appConfig="$config" :app-preview:assembleRelease
          cp app-preview/build/outputs/apk/release/app-preview-release.apk "$RUNNER_TEMP/compose-cast-preview.apk"
      - name: Upload compose-cast-preview.apk
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$RUNNER_TEMP/compose-cast-preview.apk" --clobber
