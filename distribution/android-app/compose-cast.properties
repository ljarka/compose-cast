# compose-cast app configuration. Missing or invalid keys fail the build with the key's name.

# Launcher label and package (unique per app; never change it after publishing).
app.name=My App
app.applicationId=com.example.myapp
# Optional: versionCode must grow with every release.
app.versionCode=1
app.versionName=1.0

# Your compose-cast server (docs/playbooks/install-server.md). Release builds require https://;
# debug builds may use http://10.0.2.2:8080 (the host's localhost from the emulator).
app.serverUrl=https://app.example.com

# Native frame around the server's screens (top app bar, status bar, splash).
app.frame.primaryColor=#6200EE
app.frame.backgroundColor=#FAFAFA

# Optional launcher icon: PNG/JPG next to this file, square, >= 432 px. Empty = default icon.
app.icon=
app.icon.backgroundColor=
